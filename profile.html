<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ sơ cá nhân — Thám tử Kinh tế</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

<nav class="navbar" id="navbar">
  <div class="container nav-inner">
    <a href="index.html" class="nav-brand">
      <svg class="nav-brand-icon" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="20" fill="#0d1426"/>
        <path d="M8 16 Q20 10 32 16 L30 18 Q20 13 10 18Z" fill="#d4a017"/>
        <rect x="7" y="16" width="26" height="3" rx="1.5" fill="#d4a017"/>
        <ellipse cx="20" cy="23" rx="7" ry="8" fill="#1a2540"/>
        <circle cx="26" cy="28" r="5" stroke="#d4a017" stroke-width="1.5" fill="none"/>
        <line x1="29.5" y1="31.5" x2="33" y2="35" stroke="#d4a017" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <div class="nav-brand-text">
        <span class="nav-brand-title">Thám tử Kinh tế</span>
        <span class="nav-brand-sub">Hồ sơ cá nhân</span>
      </div>
    </a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Trang chủ</a>
      <a href="cases.html" class="nav-link">Vụ án</a>
    </div>
    <div class="nav-right" id="nav-auth-area"></div>
  </div>
</nav>

<div style="min-height:100vh;padding:calc(var(--nav-height) + var(--space-10)) 0 var(--space-16);background:var(--navy-950);">
  <div class="container" style="max-width:860px;">

    <!-- Profile header -->
    <div id="profile-header" style="display:flex;align-items:center;gap:var(--space-6);margin-bottom:var(--space-8);padding:var(--space-6);background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:24px;backdrop-filter:blur(12px);">
      <!-- Avatar big -->
      <div id="avatar-big" style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--gold-600),var(--gold-400));display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:900;color:var(--navy-950);flex-shrink:0;box-shadow:0 0 30px rgba(212,160,23,.3);"></div>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;margin-bottom:var(--space-2);">
          <h1 id="profile-name-display" style="font-size:1.4rem;margin:0;"></h1>
          <span id="profile-role-badge" class="badge"></span>
          <span id="profile-vip-badge" class="badge badge-vip" style="display:none;">⭐ VIP</span>
        </div>
        <div id="profile-email-display" style="color:var(--text-muted);font-size:0.85rem;margin-bottom:var(--space-2);font-family:var(--font-mono);"></div>
        <div id="profile-joined" style="color:var(--text-faint);font-size:0.78rem;"></div>
      </div>
      <div id="vip-upgrade-cta" style="display:none;">
        <a href="resources.html#vip" class="btn btn-primary btn-sm">⭐ Nâng cấp VIP</a>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:240px 1fr;gap:var(--space-6);align-items:start;">

      <!-- Sidebar menu -->
      <div style="position:sticky;top:calc(var(--nav-height)+16px);display:flex;flex-direction:column;gap:var(--space-2);">
        <button class="profile-menu-item active" onclick="showTab('info', this)">👤 Thông tin cá nhân</button>
        <button class="profile-menu-item" onclick="showTab('security', this)">🔒 Bảo mật</button>
        <button class="profile-menu-item" onclick="showTab('activity', this)">📊 Hoạt động</button>
        <button class="profile-menu-item" onclick="showTab('vip', this)">⭐ Gói thành viên</button>
        <div style="margin-top:var(--space-4);padding-top:var(--space-4);border-top:1px solid rgba(255,255,255,.06);">
          <button class="profile-menu-item" style="color:var(--red-400);" onclick="AUTH.logout()">🚪 Đăng xuất</button>
        </div>
      </div>

      <!-- Content area -->
      <div>
        <!-- Tab: Info -->
        <div id="tab-info" class="profile-tab active">
          <div class="card card-body">
            <h3 style="font-size:1rem;margin-bottom:var(--space-5);">👤 Thông tin cá nhân</h3>
            <form onsubmit="saveInfo(event)" novalidate>
              <div class="form-group">
                <label class="form-label">Họ và tên</label>
                <input type="text" class="form-input" id="edit-name" placeholder="Nguyễn Văn An">
              </div>
              <div class="form-group">
                <label class="form-label">Email <span style="color:var(--text-faint);font-size:0.75rem;">(không thể thay đổi)</span></label>
                <input type="email" class="form-input" id="edit-email" disabled style="opacity:.5;cursor:not-allowed;">
              </div>
              <div id="info-msg" style="display:none;" class="form-msg"></div>
              <button type="submit" class="btn btn-primary btn-sm">💾 Lưu thay đổi</button>
            </form>
          </div>
        </div>

        <!-- Tab: Security -->
        <div id="tab-security" class="profile-tab">
          <div class="card card-body">
            <h3 style="font-size:1rem;margin-bottom:var(--space-5);">🔒 Đổi mật khẩu</h3>
            <form onsubmit="saveSecurity(event)" novalidate>
              <div class="form-group">
                <label class="form-label">Mật khẩu mới</label>
                <div style="position:relative;">
                  <input type="password" class="form-input" id="new-password" placeholder="Tối thiểu 6 ký tự" style="padding-right:44px;">
                  <button type="button" onclick="togglePassword('new-password','tpwd-new')" id="tpwd-new" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:1.1rem;line-height:1;padding:4px;">👁</button>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Xác nhận mật khẩu mới</label>
                <div style="position:relative;">
                  <input type="password" class="form-input" id="confirm-password" placeholder="Nhập lại mật khẩu" style="padding-right:44px;">
                  <button type="button" onclick="togglePassword('confirm-password','tpwd-cf')" id="tpwd-cf" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:1.1rem;line-height:1;padding:4px;">👁</button>
                </div>
              </div>
              <div id="sec-msg" style="display:none;" class="form-msg"></div>
              <button type="submit" class="btn btn-primary btn-sm">🔒 Cập nhật mật khẩu</button>
            </form>
          </div>
        </div>

        <!-- Tab: Activity -->
        <div id="tab-activity" class="profile-tab">
          <div class="card card-body">
            <h3 style="font-size:1rem;margin-bottom:var(--space-5);">📊 Hoạt động của bạn</h3>
            <div id="activity-stats" style="display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-4);margin-bottom:var(--space-6);">
              <!-- Filled by JS -->
            </div>
            <div>
              <div style="font-size:0.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);margin-bottom:var(--space-4);">Bình luận gần đây</div>
              <div id="recent-comments"></div>
            </div>
          </div>
        </div>

        <!-- Tab: VIP -->
        <div id="tab-vip" class="profile-tab">
          <div id="vip-tab-content"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>

<style>
  .profile-menu-item {
    display:block; width:100%; text-align:left;
    padding:10px 14px; border-radius:12px;
    border:none; background:none; cursor:pointer;
    font-size:0.85rem; color:var(--text-muted);
    font-family:var(--font-sans); transition:all .15s ease;
  }
  .profile-menu-item:hover { background:rgba(255,255,255,.04); color:var(--text-secondary); }
  .profile-menu-item.active { background:rgba(212,160,23,.1); color:var(--gold-400); font-weight:600; }
  .profile-tab { display:none; }
  .profile-tab.active { display:block; }
  .form-msg { padding:10px 14px; border-radius:10px; font-size:0.83rem; margin-bottom:var(--space-4); }
  .form-msg.success { background:rgba(74,222,128,.1); border:1px solid rgba(74,222,128,.25); color:var(--green-400); }
  .form-msg.error { background:rgba(220,38,38,.1); border:1px solid rgba(220,38,38,.25); color:var(--red-400); }
  @media(max-width:600px) {
    div[style*="grid-template-columns:240px"] { grid-template-columns:1fr !important; }
    div[style*="position:sticky"] { position:static !important; display:flex; flex-wrap:wrap; gap:8px; }
    .profile-menu-item { padding:8px 12px; border-radius:20px; border:1px solid rgba(255,255,255,.08); flex-shrink:0; }
  }
</style>

<script src="js/auth.js"></script>
<script src="js/forum.js"></script>
<script>
  const session = AUTH.getSession();
  if (!session) { location.href = 'login.html?back=profile.html'; }

  // Init
  AUTH.renderNavbar();

  // Fill header
  document.getElementById('avatar-big').textContent = session.avatar;
  document.getElementById('profile-name-display').textContent = session.name;
  document.getElementById('profile-email-display').textContent = session.email;

  const roleMeta = {
    admin:  { label:'🔑 Admin',  cls:'badge-red' },
    author: { label:'✍️ Author', cls:'badge-blue' },
    member: { label:'👤 Member', cls:'badge-green' },
    guest:  { label:'👻 Guest',  cls:'' }
  };
  const rm = roleMeta[session.role] || roleMeta.member;
  const rb = document.getElementById('profile-role-badge');
  rb.textContent = rm.label; rb.className = 'badge ' + rm.cls;

  if (session.vip) {
    document.getElementById('profile-vip-badge').style.display = 'inline-flex';
  } else {
    document.getElementById('vip-upgrade-cta').style.display = 'block';
  }

  // Get full user for join date
  try {
    const users = JSON.parse(localStorage.getItem('thamtu_users') || '[]');
    const u = users.find(x => x.id === session.id);
    if (u && u.joinedAt) {
      document.getElementById('profile-joined').textContent = 'Tham gia ngày ' + new Date(u.joinedAt).toLocaleDateString('vi-VN');
    }
  } catch {}

  // Fill info form
  document.getElementById('edit-name').value  = session.name;
  document.getElementById('edit-email').value = session.email;

  // Activity stats
  const comments  = JSON.parse(localStorage.getItem('thamtu_comments') || '{}');
  const allCmts   = Object.values(comments).flat().filter(c => c.userId === session.id);
  const upvotes   = allCmts.reduce((a, c) => a + (c.upvotes || 0), 0);
  const caseSeen  = parseInt(localStorage.getItem('thamtu_cases_viewed_' + session.id) || '0');

  document.getElementById('activity-stats').innerHTML = [
    { icon:'💬', val:allCmts.length, lbl:'Bình luận' },
    { icon:'👍', val:upvotes,       lbl:'Lượt upvote' },
    { icon:'🗂️', val:caseSeen,      lbl:'Vụ án đã xem' },
  ].map(s => `
    <div style="text-align:center;padding:var(--space-4);background:rgba(255,255,255,.03);border-radius:16px;border:1px solid rgba(255,255,255,.06);">
      <div style="font-size:1.6rem;margin-bottom:6px;">${s.icon}</div>
      <div style="font-size:1.4rem;font-weight:900;font-family:var(--font-mono);color:var(--gold-400);">${s.val}</div>
      <div style="font-size:0.72rem;color:var(--text-faint);">${s.lbl}</div>
    </div>
  `).join('');

  // Recent comments
  const rc = document.getElementById('recent-comments');
  if (allCmts.length === 0) {
    rc.innerHTML = '<p class="text-sm text-muted">Bạn chưa có bình luận nào.</p>';
  } else {
    rc.innerHTML = allCmts.slice(-5).reverse().map(c => `
      <div style="padding:var(--space-3) 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:0.83rem;">
        <div style="color:var(--text-secondary);margin-bottom:4px;">"${c.content.slice(0,100)}..."</div>
        <div style="font-size:0.72rem;color:var(--text-faint);">${new Date(c.createdAt).toLocaleDateString('vi-VN')}</div>
      </div>
    `).join('');
  }

  // VIP tab
  const vipContent = document.getElementById('vip-tab-content');
  if (session.vip) {
    vipContent.innerHTML = `
      <div class="card card-body" style="text-align:center;">
        <div style="font-size:3rem;margin-bottom:var(--space-4);">⭐</div>
        <h3 style="font-size:1.1rem;margin-bottom:var(--space-3);color:var(--gold-400);">Bạn đang là thành viên VIP!</h3>
        <p class="text-sm text-muted mb-6">Toàn bộ nội dung cao cấp đã được mở khóa cho bạn. Cảm ơn sự ủng hộ!</p>
        <div style="background:rgba(212,160,23,.08);border:1px solid rgba(212,160,23,.2);border-radius:16px;padding:var(--space-5);">
          <div style="font-size:0.8rem;color:var(--text-muted);margin-bottom:8px;">Gói hiện tại</div>
          <div style="font-size:1.3rem;font-weight:900;color:var(--gold-400);font-family:var(--font-mono);">VIP Member</div>
          <div style="font-size:0.8rem;color:var(--text-faint);margin-top:6px;">Gia hạn hàng tháng</div>
        </div>
      </div>
    `;
  } else {
    vipContent.innerHTML = `
      <div class="card card-body">
        <h3 style="font-size:1rem;margin-bottom:var(--space-4);">⭐ Nâng cấp lên VIP</h3>
        <p class="text-sm text-muted mb-6">Mở khóa toàn bộ nội dung cao cấp:</p>
        <ul style="list-style:none;display:flex;flex-direction:column;gap:10px;margin-bottom:var(--space-6);">
          ${['Vụ án kinh điển: Enron, Wirecard, Parmalat...','Audit Simulator — Game mô phỏng kiểm toán','Tải tài liệu PDF chuyên sâu','Không giới hạn bình luận & thảo luận'].map(f => `
            <li style="display:flex;align-items:center;gap:var(--space-3);font-size:0.85rem;color:var(--text-secondary);">
              <span style="color:var(--gold-400);flex-shrink:0;">✓</span> ${f}
            </li>
          `).join('')}
        </ul>
        <div style="display:flex;align-items:center;gap:var(--space-4);margin-bottom:var(--space-5);">
          <div style="font-family:var(--font-mono);font-size:1.8rem;font-weight:900;color:var(--gold-400);">99.000₫</div>
          <div style="font-size:0.8rem;color:var(--text-muted);">/tháng<br>Tự động gia hạn, hủy bất kỳ lúc nào</div>
        </div>
        <a href="resources.html#vip" class="btn btn-primary">⭐ Nâng cấp ngay</a>
      </div>
    `;
  }

  // Tab switching
  function showTab(name, btn) {
    document.querySelectorAll('.profile-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.profile-menu-item').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    btn.classList.add('active');
  }

  // Save info
  function saveInfo(e) {
    e.preventDefault();
    const name = document.getElementById('edit-name').value.trim();
    const msg  = document.getElementById('info-msg');
    if (name.length < 2) { showMsg(msg, 'Tên phải có ít nhất 2 ký tự.', 'error'); return; }
    const result = AUTH.updateProfile({ name });
    if (result.ok) {
      showMsg(msg, '✅ Đã cập nhật thành công!', 'success');
      document.getElementById('profile-name-display').textContent = name;
      document.getElementById('avatar-big').textContent = name.trim().split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
    } else {
      showMsg(msg, '❌ ' + result.msg, 'error');
    }
  }

  // Save password
  function saveSecurity(e) {
    e.preventDefault();
    const pwd  = document.getElementById('new-password').value;
    const conf = document.getElementById('confirm-password').value;
    const msg  = document.getElementById('sec-msg');
    if (pwd.length < 6) { showMsg(msg, 'Mật khẩu phải có ít nhất 6 ký tự.', 'error'); return; }
    if (pwd !== conf)   { showMsg(msg, 'Mật khẩu xác nhận không khớp.', 'error'); return; }
    const result = AUTH.updateProfile({ password: pwd });
    if (result.ok) {
      showMsg(msg, '✅ Mật khẩu đã được cập nhật!', 'success');
      document.getElementById('new-password').value = '';
      document.getElementById('confirm-password').value = '';
    } else {
      showMsg(msg, '❌ ' + result.msg, 'error');
    }
  }

  function showMsg(el, text, type) {
    el.textContent = text;
    el.className = 'form-msg ' + type;
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 4000);
  }

  function togglePassword(inputId, btnId) {
    const inp = document.getElementById(inputId);
    inp.type = inp.type === 'password' ? 'text' : 'password';
    document.getElementById(btnId).textContent = inp.type === 'password' ? '👁' : '🙈';
  }

  // Navbar scroll effect
  window.addEventListener('scroll', () => {
    document.getElementById('navbar')?.classList.toggle('scrolled', window.scrollY > 20);
  });
</script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-analytics-compat.js"></script>
<script src="js/firebase-config.js"></script>
</body>
