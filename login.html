<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập — Thám tử Kinh tế</title>
  <meta name="description" content="Đăng nhập vào cộng đồng phân tích gian lận tài chính Thám tử Kinh tế">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 40% 30%,rgba(212,160,23,.07) 0%,transparent 60%),var(--navy-950);padding:var(--space-8);">

<!-- Floating background grid -->
<div class="hero-bg-grid" style="position:fixed;inset:0;pointer-events:none;z-index:0;"></div>

<a href="index.html" class="nav-brand" style="position:fixed;top:24px;left:32px;z-index:10;text-decoration:none;">
  <svg width="32" height="32" viewBox="0 0 40 40" fill="none">
    <circle cx="20" cy="20" r="20" fill="#0d1426"/>
    <path d="M8 16 Q20 10 32 16 L30 18 Q20 13 10 18Z" fill="#d4a017"/>
    <rect x="7" y="16" width="26" height="3" rx="1.5" fill="#d4a017"/>
    <ellipse cx="20" cy="23" rx="7" ry="8" fill="#1a2540"/>
    <circle cx="26" cy="28" r="5" stroke="#d4a017" stroke-width="1.5" fill="none"/>
    <line x1="29.5" y1="31.5" x2="33" y2="35" stroke="#d4a017" stroke-width="1.8" stroke-linecap="round"/>
  </svg>
  <span style="font-weight:800;color:var(--gold-400);font-size:1rem;">Thám tử Kinh tế</span>
</a>

<div style="width:100%;max-width:420px;position:relative;z-index:1;">

  <!-- Card -->
  <div style="background:var(--glass-bg);border:1px solid rgba(212,160,23,.2);border-radius:24px;padding:var(--space-8);backdrop-filter:blur(20px);box-shadow:0 0 80px rgba(212,160,23,.08);">

    <div style="text-align:center;margin-bottom:var(--space-7);">
      <div style="font-size:2.5rem;margin-bottom:var(--space-3);">🔑</div>
      <h1 style="font-size:1.4rem;margin-bottom:var(--space-2);">Đăng nhập</h1>
      <p style="font-size:0.85rem;color:var(--text-muted);">Tiếp tục hành trình phá án của bạn</p>
    </div>

    <form id="login-form" onsubmit="doLogin(event)" novalidate>

      <div class="form-group">
        <label class="form-label">📧 Email</label>
        <input type="email" class="form-input" id="login-email" placeholder="detective@gmail.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label">🔒 Mật khẩu</label>
        <div style="position:relative;">
          <input type="password" class="form-input" id="login-password" placeholder="••••••••" required autocomplete="current-password" style="padding-right:44px;">
          <button type="button" id="toggle-pwd" onclick="togglePassword('login-password','toggle-pwd')"
            style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:1.1rem;line-height:1;padding:4px;">
            👁
          </button>
        </div>
      </div>

      <div id="login-error" style="display:none;background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.25);border-radius:10px;padding:10px 14px;font-size:0.83rem;color:var(--red-400);margin-bottom:var(--space-4);"></div>

      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:var(--space-2);font-size:0.95rem;padding:14px;" id="login-btn">
        <span id="login-btn-text">🔑 Đăng nhập</span>
        <span id="login-btn-loading" style="display:none;">⏳ Đang xử lý...</span>
      </button>

    </form>

    <div style="text-align:center;margin-top:var(--space-5);font-size:0.83rem;color:var(--text-faint);">
      Chưa có tài khoản?
      <a href="register.html" style="color:var(--gold-400);text-decoration:none;font-weight:600;"> Đăng ký miễn phí →</a>
    </div>

    <!-- Demo hint -->
    <div style="margin-top:var(--space-5);padding:12px;background:rgba(255,255,255,.03);border-radius:12px;border:1px solid rgba(255,255,255,.06);">
      <p style="font-size:0.72rem;color:var(--text-faint);text-align:center;margin-bottom:8px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;">Tài khoản Demo</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
        <button onclick="fillDemo('admin@thamtu.vn','ThamTuKT@2024')" class="btn btn-ghost" style="font-size:0.72rem;padding:5px 10px;">
          🔑 Admin
        </button>
        <button onclick="quickRegisterDemo('member')" class="btn btn-ghost" style="font-size:0.72rem;padding:5px 10px;">
          👤 Member Demo
        </button>
      </div>
    </div>

  </div>

  <p style="text-align:center;margin-top:var(--space-5);font-size:0.75rem;color:var(--text-faint);">
    © 2026 Thám tử Kinh tế · <a href="index.html" style="color:var(--text-faint);">Trang chủ</a>
  </p>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="js/auth.js"></script>
<script>
  // Redirect if already logged in
  if (AUTH.getSession()) {
    const back = new URLSearchParams(location.search).get('back') || 'index.html';
    location.href = back;
  }

  function doLogin(e) {
    e.preventDefault();
    const email    = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errEl    = document.getElementById('login-error');
    const btnText  = document.getElementById('login-btn-text');
    const btnLoad  = document.getElementById('login-btn-loading');

    errEl.style.display = 'none';
    btnText.style.display = 'none';
    btnLoad.style.display = 'inline';

    setTimeout(() => {
      const result = AUTH.login(email, password);
      btnText.style.display = 'inline';
      btnLoad.style.display = 'none';

      if (result.ok) {
        showToast('✅ Đăng nhập thành công! Chào ' + result.user.name.split(' ').pop(), 'success', 2000);
        setTimeout(() => {
          const back = new URLSearchParams(location.search).get('back') || 'index.html';
          location.href = back;
        }, 800);
      } else {
        errEl.textContent = '❌ ' + result.msg;
        errEl.style.display = 'block';
        document.getElementById('login-password').value = '';
      }
    }, 500);
  }

  function togglePassword(inputId, btnId) {
    const inp = document.getElementById(inputId);
    inp.type = inp.type === 'password' ? 'text' : 'password';
    document.getElementById(btnId).textContent = inp.type === 'password' ? '👁' : '🙈';
  }

  function fillDemo(email, pass) {
    document.getElementById('login-email').value    = email;
    document.getElementById('login-password').value = pass;
  }

  function quickRegisterDemo(role) {
    const email = `demo_${Date.now()}@thamtu.vn`;
    const res = AUTH.register({ name: 'Thám Tử Demo', email, password: 'Demo@123', role });
    if (res.ok) {
      showToast('✅ Đã tạo tài khoản demo và đăng nhập!', 'success', 2000);
      setTimeout(() => location.href = 'index.html', 900);
    }
  }

  // Enter key on email → focus password
  document.getElementById('login-email').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('login-password').focus();
  });
</script>

<!-- ── Firebase CDN ──────────────────────────────────────── -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-analytics-compat.js"></script>
<script src="js/firebase-config.js"></script>
</body>
</html>
